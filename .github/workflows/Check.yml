Write-Host "📥 Installing Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -TimeoutSec 60
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
          Write-Host "✅ Ngrok downloaded and extracted"
          
          # Kiểm tra xem Secret có bị rỗng không
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            Write-Host "❌ LỖI: Secret NGROK_AUTHTOKEN đang bị rỗng! Bạn hãy kiểm tra lại Repository Secrets trên GitHub."
            exit 1
          }
          
          Write-Host "🔑 Configuring Ngrok AuthToken..."
          .\ngrok.exe config add-authtoken $env:NGROK_AUTHTOKEN
          
          Write-Host "🌐 Starting Ngrok tunnel..."
          # Ghi log trực tiếp vào ngrok.log để kiểm tra nếu xảy ra lỗi
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "http", "6080", "--log=ngrok.log", "--log-level=debug" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          Write-Host "🔍 Retrieving Ngrok Public URL..."
          $maxAttempts = 20
          $attempt = 0
          $ngrokUrl = ""
          
          do {
            $attempt++
            Write-Host "🔄 Querying ngrok API ($attempt/$maxAttempts)..."
            Start-Sleep -Seconds 2
            
            # Kiểm tra xem tiến trình ngrok còn chạy hay đã chết
            $ngrokProc = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
            if (-not $ngrokProc) {
              Write-Host "❌ Tiến trình ngrok.exe đã bị văng (crashed)!"
              Write-Host "📄 Nội dung lỗi trong file ngrok.log:"
              Get-Content "ngrok.log" -ErrorAction SilentlyContinue | Write-Host
              exit 1
            }
            
            try {
              $tunnelInfo = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5 -ErrorAction Stop
              if ($tunnelInfo.tunnels -and $tunnelInfo.tunnels.Count -gt 0) {
                $ngrokUrl = $tunnelInfo.tunnels[0].public_url
                Write-Host "✅ Found Ngrok URL: $ngrokUrl"
                break
              }
            } catch {
              Write-Host "⏳ Waiting for Ngrok tunnel..."
            }
          } while ($attempt -lt $maxAttempts)
          
          if ($ngrokUrl) {
            $remoteLink = "$ngrokUrl/vnc.html"
            Write-Host "🌌 Remote VNC URL: $remoteLink"
            $remoteLink | Out-File -FilePath "remote-link.txt" -Encoding UTF8 -NoNewline
          } else {
            Write-Host "❌ Failed to retrieve Ngrok URL"
            Write-Host "📄 Chi tiết file ngrok.log:"
            Get-Content "ngrok.log" -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }
