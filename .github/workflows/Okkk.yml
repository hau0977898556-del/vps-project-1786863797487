name: Create VPS (Auto Restart)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vps]

env:
  VPS_NAME: vps-project-1786863797487
  TMATE_SERVER: nyc1.tmate.io
  GITHUB_TOKEN_VPS: ${{ secrets.GH_TOKEN }}
  NGROK_SERVER_URL: https://vps-github.vercel.app
  NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 🐍 Tạo file VPS info
        shell: pwsh
        run: |
          mkdir -Force links
          "VPS khởi tạo - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath "links/vps-project-1786863797487.txt" -Encoding UTF8

      - name: 🖥️ Cài đặt và chạy TightVNC, noVNC, Ngrok
        shell: pwsh
        run: |
          Write-Host "📥 Đang cài đặt TightVNC, noVNC và Ngrok..."

          try {
            Write-Host "📥 Đang tải TightVNC..."
            Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile "tightvnc-setup.msi" -TimeoutSec 60
            Write-Host "✅ TightVNC đã tải xong"

            Start-Process msiexec.exe -Wait -ArgumentList '/i tightvnc-setup.msi /quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=hieudz SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'
            Write-Host "✅ TightVNC đã cài đặt xong"

            Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -ErrorAction SilentlyContinue

            Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
            Stop-Service -Name "tvnserver" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5

            $portCheck = netstat -aon | FindStr :5900
            if ($portCheck) {
              Stop-Process -Id ($portCheck -split '\s+')[-1] -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }

            Write-Host "🚀 Đang khởi động TightVNC server..."
            Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden -RedirectStandardOutput "vnc_start.log" -RedirectStandardError "vnc_error.log"
            Start-Sleep -Seconds 20

            netsh advfirewall firewall add rule name="Allow VNC 5900" dir=in action=allow protocol=TCP localport=5900
            netsh advfirewall firewall add rule name="Allow noVNC 6080" dir=in action=allow protocol=TCP localport=6080

            Write-Host "📥 Cài đặt Python dependencies..."
            python -m pip install --upgrade pip --timeout 60 2>&1 | Out-Null
            pip install --force-reinstall numpy novnc websockify==0.13.0 --timeout 60 2>&1 | Out-Null

            $novncVersion = "v1.6.0"
            Write-Host "📥 Đang tải noVNC..."
            Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/$novncVersion.zip" -OutFile "noVNC.zip" -TimeoutSec 60
            Expand-Archive -Path "noVNC.zip" -DestinationPath "." -Force
            Move-Item -Path "noVNC-$($novncVersion.Substring(1))" -Destination "noVNC" -Force
            $novncPath = "noVNC"

            Write-Host "🚀 Đang khởi động websockify..."
            Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", "$novncPath", "--verbose" -RedirectStandardOutput "websockify.log" -RedirectStandardError "websockify_error.log" -NoNewWindow -PassThru
            Start-Sleep -Seconds 10

            Write-Host "📥 Đang tải và cấu hình Ngrok..."
            Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -TimeoutSec 60
            Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

            # Kiểm tra token rỗng trước khi chạy
            if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
              Write-Host "❌ LỖI: Secret NGROK_AUTHTOKEN trên GitHub đang bị trống hoặc sai tên!"
              exit 1
            }

            .\ngrok.exe config add-authtoken $env:NGROK_AUTHTOKEN

            Write-Host "🌐 Đang khởi động Ngrok tunnel..."
            Start-Process -FilePath ".\ngrok.exe" -ArgumentList "http", "6080", "--log=ngrok.log", "--log-level=debug" -WindowStyle Hidden
            Start-Sleep -Seconds 5

            Write-Host "🔍 Đang lấy public URL từ Ngrok API..."
            $maxAttempts = 20
            $attempt = 0
            $ngrokUrl = ""

            do {
              $attempt++
              Write-Host "🔄 Query ngrok API ($attempt/$maxAttempts)..."
              Start-Sleep -Seconds 2

              # Bắt lỗi nếu ngrok văng tiến trình
              $ngrokProc = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
              if (-not $ngrokProc) {
                Write-Host "❌ Tiến trình ngrok.exe đã bị văng (crashed)!"
                Write-Host "📄 Chi tiết lỗi trong ngrok.log:"
                Get-Content "ngrok.log" -ErrorAction SilentlyContinue | Write-Host
                exit 1
              }

              try {
                $tunnelInfo = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5 -ErrorAction Stop
                if ($tunnelInfo.tunnels -and $tunnelInfo.tunnels.Count -gt 0) {
                  $ngrokUrl = $tunnelInfo.tunnels[0].public_url
                  Write-Host "✅ Đã lấy được Ngrok URL: $ngrokUrl"
                  break
                }
              } catch {
                Write-Host "⏳ Đang chờ tunnel mở..."
              }
            } while ($attempt -lt $maxAttempts)

            if ($ngrokUrl) {
              $remoteLink = "$ngrokUrl/vnc.html"
              Write-Host "🌌 Link truy cập noVNC: $remoteLink"
              $remoteLink | Out-File -FilePath "remote-link.txt" -Encoding UTF8 -NoNewline

              try {
                git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git config --global user.name "github-actions[bot]"
                git add remote-link.txt
                git commit -m "🔗 Updated remote-link.txt - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
                git push origin main --force-with-lease
                Write-Host "✅ Đã commit remote-link.txt"
              } catch {
                Write-Host "⚠️ Không thể commit link: $_"
              }

              try {
                $body = @{ github_token = "$env:GITHUB_TOKEN_VPS"; vnc_link = $remoteLink } | ConvertTo-Json
                Invoke-RestMethod -Uri "$env:NGROK_SERVER_URL/api/vpsuser" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 20
                Write-Host "📤 Đã gửi link về server trung gian"
              } catch {
                Write-Host "⚠️ Gửi link về server thất bại: $_"
              }
            } else {
              Write-Host "❌ Không thể lấy URL từ Ngrok"
              Write-Host "📄 Chi tiết ngrok.log:"
              Get-Content "ngrok.log" -ErrorAction SilentlyContinue | Write-Host
              exit 1
            }
          } catch {
            Write-Host "⚠️ Lỗi trong quá trình khởi tạo: $_"
            exit 1
          }

          Write-Host "🚀 VPS đã khởi động thành công (Pass VNC: hieudz)"

          $totalMinutes = 330
          for ($i = 1; $i -le $totalMinutes; $i++) {
            $currentTime = Get-Date -Format 'HH:mm:ss'
            Write-Host "🟢 VPS đang chạy - Phút $i/$totalMinutes ($currentTime)"
            Start-Sleep -Seconds 60
          }

      - name: 🔄 Auto Restart Workflow
        if: always()
        shell: pwsh
        run: |
          $currentTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          Write-Host "🔁 Bắt đầu khởi động lại workflow lúc $currentTime"

          try {
            Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
            Stop-Process -Name "python" -Force -ErrorAction SilentlyContinue
            Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "⚠️ Dọn dẹp tiến trình thất bại: $_"
          }

          try {
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GITHUB_TOKEN_VPS"
              "Content-Type" = "application/json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $payload = @{
              event_type = "create-vps"
              client_payload = @{
                vps_name = "$env:VPS_NAME"
                restart_time = $currentTime
                auto_restart = $true
              }
            } | ConvertTo-Json -Depth 2

            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/dispatches" -Method Post -Headers $headers -Body $payload -TimeoutSec 30
            Write-Host "✅ Đã kích hoạt restart workflow thành công"
          } catch {
            Write-Host "❌ Kích hoạt restart thất bại: $_"
            exit 1
          }
